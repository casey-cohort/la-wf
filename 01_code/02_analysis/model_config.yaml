seed: 112358
user: 'akd'
outcome_type: 'rate'
# outcome_type:'num'

# Specify which models to run using ONE of the following approaches:
#
# OPTION 1: models_to_run (cartesian product - runs all combinations)
# OPTION 2: models_to_run_flat (explicit list - run specific combinations only)
#
# See README.md for detailed examples and usage instructions.
# IMPORTANT: Use multi-line format for models_to_run_flat (as shown below).

# OPTION 1: Uncomment to use cartesian product
# models_to_run:
#   encounter_type: ["ED"]
#   exposure_category: ["evac"]
#   cause: ["enc_resp", "enc_cardio", "enc_injury", "enc_neuro"]

# OPTION 2: Currently active (comment out to use models_to_run instead)
models_to_run_flat:
  # - encounter_type: "ED"
  #   exposure_category: "evac"
  #   cause: "enc_cardio"
  - encounter_type: "ED"
    exposure_category: "none"
    cause: "enc_neuro"

grid_params:
  # XGBoost parameters - more conservative to reduce overfitting
  mtry:
    range: [10, 32]
    tune: true
  min_n:
    range: [5, 30]
    tune: true
  tree_depth:
    range: [3, 8]
    tune: true
  learn_rate:
    range: [0.01, 0.1]
    tune: true
  loss_reduction:
    range: [-5, 1]
    tune: true
  stop_iter:
    range: [10, 50]
    tune: true
  # New XGBoost parameters for regularization
  trees:
    range: [8, 25] # default is 15
    tune: true
  sample_size:
    range: [0.6, 1.0] # default is 1
    tune: true
  # Prophet changepoint parameters for trend regularization
  changepoint_num:
    range: [18, 28] # default is 25
    tune: false
  changepoint_range:
    range: [0.6, 0.9] # default is 0.8
    tune: false
  prior_scale_changepoints:
    range: [0.05, 0.05] # default is 0.05
    tune: false

train_test_params: 
  assess_split: "67 days"
  assess_cv: "45 days"
  skip_cv: "14 days"
  slice_limit_cv: 5
  holdout_date: "2025-01-06"  # Dates after this are considered holdout period
  validation: 0.1  # XGBoost internal validation split for early stopping
# can give a list of combinations so we can try many things -- so maybe increments of 5 and all combos.

# Grid size for hyperparameter tuning
grid_size: 200

# Number of moving block bootstrap simulations for confidence intervals
n_sim_mbb: 100

# Block length (in days) for Moving Block Bootstrap
block_length_mbb: 14

# MASE seasonality parameter (for naive forecast baseline)
mase_seasonality: 7

# Denominator for calculating rates (default: 100000)
rates_denom: 100000

# Confidence Interval Configuration
ci_params:
  method: "quantile"  # Options: "quantile", "symmetric_sd"
  level: 0.95         # Confidence level (0-1)
  ensure_nonnegative: true  # For count outcomes, truncate at 0

# Number of CPU cores to leave free (used by both tuning and MBB scripts)
cores_to_leave_out: 2

# model description
model_description: "Balanced hyperparameters"
