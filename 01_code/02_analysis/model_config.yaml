seed: 0112358

# Specify which models to run using ONE of the following approaches:
#
# OPTION 1: models_to_run (cartesian product - runs all combinations)
# OPTION 2: models_to_run_flat (explicit list - run specific combinations only)
#
# See README.md for detailed examples and usage instructions.
# IMPORTANT: Use multi-line format for models_to_run_flat (as shown below).

# OPTION 1: Uncomment to use cartesian product
models_to_run:
  encounter_type: ["IP", "ED"]
  exposure_category: ["evac", "high_smoke", "mid_smoke", "none"]
  cause: ["num_enc", "num_enc_resp", "num_enc_cardio", "num_enc_injury", "num_enc_neuro"]

# OPTION 2: Currently active (comment out to use models_to_run instead)
# models_to_run_flat:
#   - encounter_type: "IP"
#     exposure_category: "evac"
#     cause: "num_enc_resp"
#   - encounter_type: "ED"
#     exposure_category: "high_smoke"
#     cause: "num_enc_cardio"

grid_params:
  mtry: [3, 10]
  min_n: [5, 30]
  tree_depth: [3, 8]
  learn_rate: [0.01, 0.1]
  loss_reduction: [-5, 1]
  stop_iter: [10, 50]

train_test_params: 
  assess_split: "67 days"
  assess_cv: "30 days"
  skip_cv: "7 days"
  slice_limit_cv: 5
# can give a list of combinations so we can try many things -- so maybe increments of 5 and all combos.

# Number of moving block bootstrap simulations for confidence intervals
n_sim_mbb: 100


# For later, we want to be able to have different sets of params run
# for specific models. Here's an idea of how to do that.
# Create a top level params key.  In params, have a global config
# and then override configs for specific models. E.g.
